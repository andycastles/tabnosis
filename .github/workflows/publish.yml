name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'          # triggers on version tags, e.g. v2.1, v3.0.0
  workflow_dispatch:  # allows manual trigger from the GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          zip -r tabnosis.zip \
            manifest.json \
            tabnosis.html \
            tabnosis.js \
            rules.json \
            icons/

      - name: Upload & publish to Chrome Web Store
        uses: trmcnvn/upload-to-chrome-webstore@v1
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: tabnosis.zip
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: false   # set to false to upload without auto-publishing
