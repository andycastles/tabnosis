name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-version:refname | head -n 1)
          echo "tag=${TAG:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Determine version bump
        id: bump
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Collect commits since last tag
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${TAG}..HEAD" --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          echo "--- Commits since $TAG ---"
          echo "$COMMITS"

          if echo "$COMMITS" | grep -qiE '^(feat|fix|chore|refactor|perf|style|test|docs|build|ci)(\(.+\))?!:|BREAKING CHANGE'; then
            BUMP=major
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif echo "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP=minor
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          elif echo "$COMMITS" | grep -qiE '^(fix|perf|refactor|style|test|docs|build|ci|chore)(\(.+\))?:'; then
            BUMP=patch
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            echo "No conventional commits found — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        if: steps.bump.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          # Use jq if available, else sed
          if command -v jq >/dev/null 2>&1; then
            jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" manifest.json
          fi
          echo "Updated manifest.json to version $VERSION"
          cat manifest.json

      - name: Build zip
        if: steps.bump.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          zip -r "tabnosis-v${VERSION}.zip" . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "*.zip" \
            --exclude "_metadata/*"
          echo "Built tabnosis-v${VERSION}.zip"

      - name: Generate changelog
        if: steps.bump.outputs.skip != 'true'
        id: changelog
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${TAG}..HEAD" --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          fi

          FEATURES=$(echo "$COMMITS" | grep -iE '^- feat' || true)
          FIXES=$(echo "$COMMITS" | grep -iE '^- fix' || true)
          OTHER=$(echo "$COMMITS" | grep -ivE '^- (feat|fix)' || true)

          NOTES=""
          if [ -n "$FEATURES" ]; then
            NOTES+="### ✨ Features"$'\n'"$FEATURES"$'\n\n'
          fi
          if [ -n "$FIXES" ]; then
            NOTES+="### 🐛 Bug Fixes"$'\n'"$FIXES"$'\n\n'
          fi
          if [ -n "$OTHER" ]; then
            NOTES+="### 🔧 Other Changes"$'\n'"$OTHER"$'\n\n'
          fi

          # Write to file to avoid quoting issues
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Commit version bump
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: release ${{ steps.bump.outputs.new_tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          gh release create "${{ steps.bump.outputs.new_tag }}" \
            "tabnosis-v${VERSION}.zip" \
            --title "Tabnosis ${{ steps.bump.outputs.new_tag }}" \
            --notes-file release_notes.md
